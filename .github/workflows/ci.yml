name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Security scan (Bandit)
        run: bandit -q -r nightwatch
      - name: Tests
        run: pytest -q
      - name: Run against sample logs
        run: nightwatch --auth samples/auth.log --web samples/access.log --year 2026 --html reports/report.html --json reports/report.json --db reports/hunt.db
      - name: Run every SQL hunting query
        run: nightwatch-hunt --db reports/hunt.db --all
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.13'
        with:
          name: sample-report
          path: reports/
