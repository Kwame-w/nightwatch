[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nightwatch"
version = "1.0.0"
description = "Detect brute force, password spraying, web attacks and scanners in Linux auth and web access logs, mapped to MITRE ATT&CK."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Environment :: Console",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "bandit>=1.7"]

[project.scripts]
nightwatch = "nightwatch.cli:main"
nightwatch-hunt = "nightwatch.hunt:main"

[tool.setuptools]
packages = ["nightwatch"]

[tool.setuptools.package-data]
nightwatch = ["schema.sql", "queries/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # long log-format strings read better unwrapped
